<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaestroDeck</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .main-area {
      flex: 1;
      background: #000;
      min-width: 0;
      position: relative;
    }

    #sidebar-divider {
      width: 1px;
      background: #222;
      flex-shrink: 0;
      cursor: col-resize;
      position: relative;
      transition: background 0.15s;
    }
    #sidebar-divider:hover,
    #sidebar-divider.dragging { background: #3a3a3a; }
    #sidebar-divider::after {
      content: '';
      position: absolute;
      top: 0;
      left: -4px;
      right: -4px;
      bottom: 0;
    }

    #sidebar {
      background: #000;
      flex-shrink: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="main-area">
      <div id="tile-canvas"></div>
    </div>
    <div id="sidebar-divider"></div>
    <div id="sidebar"></div>
  </div>
  <script src="/titlebar.js"></script>
  <script type="module">
    import { init } from '/tiles-framework.js';
    init({ workspacePath: new URLSearchParams(location.search).get('path') || '' });
  </script>
</body>
</html>
