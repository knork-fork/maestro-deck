<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaestroDeck</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .main-area {
      flex: 1;
      background: #000;
      min-width: 0;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div id="tabs-sidebar"></div>
    <div id="tabs-sidebar-divider"></div>
    <div class="main-area">
      <div id="canvas-container"></div>
    </div>
    <div id="sidebar-divider"></div>
    <div id="sidebar"></div>
  </div>
  <script src="/titlebar.js"></script>
  <script type="module">
    import { init } from '/tiles-framework.js';
    init({ workspacePath: new URLSearchParams(location.search).get('path') || '' });
  </script>
</body>
</html>
