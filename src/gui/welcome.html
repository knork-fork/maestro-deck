<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaestroDeck</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      background: #1e1e1e;
      color: #cccccc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel ── */
    .left-panel {
      width: 290px;
      flex-shrink: 0;
      padding: 52px 36px 36px;
      overflow-y: auto;
      background: #252526;
      border-right: 1px solid #3c3c3c;
    }

    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
    }
    .app-icon {
      width: 85px;
      height: 85px;
    }
    .app-name {
      font-size: 28px;
      font-weight: 300;
      color: #e8e8e8;
      letter-spacing: -0.5px;
    }
    .app-version {
      font-size: 11px;
      color: #555;
      margin-top: -4px;
    }

    .section { margin-bottom: 32px; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6c6c6c;
      margin-bottom: 10px;
    }

    /* Action buttons */
    .action-list { list-style: none; }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 6px 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #4fc1ff;
      font-size: 13px;
      text-align: left;
      border-radius: 3px;
      transition: color 0.1s;
    }
    .action-btn:hover { color: #7dd3fc; }
    .action-btn svg { flex-shrink: 0; opacity: 0.9; }

    /* Recent list */
    .recent-list { list-style: none; }
    .recent-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 5px 6px;
      margin: 0 -6px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .recent-item:hover { background: #2a2d2e; }
    .recent-item:hover .recent-name { color: #e8e8e8; }
    .recent-folder-icon { flex-shrink: 0; margin-top: 1px; color: #c09553; }
    .recent-info { min-width: 0; }
    .recent-name {
      color: #cccccc;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-path {
      font-size: 11px;
      color: #636363;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .no-recent {
      font-size: 13px;
      color: #555;
      font-style: italic;
      padding: 4px 0;
    }

    .more-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #4fc1ff;
      cursor: pointer;
    }
    .more-link:hover { color: #7dd3fc; }

    /* ── Right panel ── */
    .right-panel {
      flex: 1;
      padding: 52px 52px 36px;
      overflow-y: auto;
      background: #1e1e1e;
    }

    .panel-title {
      font-size: 28px;
      font-weight: 300;
      color: #e8e8e8;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
    }

    /* Release entries */
    .release {
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid #2d2d2d;
    }
    .release:last-child { border-bottom: none; margin-bottom: 0; }

    .release-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .release-tag {
      font-size: 14px;
      font-weight: 600;
      color: #e2e2e2;
    }
    .release-badge {
      font-size: 11px;
      background: #0e639c;
      color: #fff;
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 500;
    }
    .release-name {
      font-size: 12px;
      color: #888;
    }
    .release-date {
      font-size: 11px;
      color: #555;
      margin-left: auto;
    }

    .release-body {
      color: #9d9d9d;
      font-size: 13px;
      line-height: 1.75;
      position: relative;
    }
    .release-body.collapsed {
      max-height: 108px;
      overflow: hidden;
    }
    .release-body.collapsed::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(transparent, #1e1e1e);
      pointer-events: none;
    }

    .release-body ul, .release-body ol { padding-left: 20px; margin: 6px 0; }
    .release-body li { margin: 3px 0; }
    .release-body h1, .release-body h2 {
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      margin: 12px 0 6px;
    }
    .release-body h3 {
      font-size: 12px;
      font-weight: 600;
      color: #aaaaaa;
      margin: 10px 0 4px;
    }
    .release-body p { margin: 4px 0; }
    .release-body code {
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      color: #ce9178;
    }
    .release-body a { color: #4fc1ff; text-decoration: none; }
    .release-body a:hover { text-decoration: underline; }
    .release-body strong { color: #cccccc; font-weight: 600; }

    .see-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 12px;
      color: #4fc1ff;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .see-more-btn:hover { color: #7dd3fc; }

    /* Status messages */
    .status-msg {
      font-size: 13px;
      color: #555;
      font-style: italic;
    }
    .error-msg {
      font-size: 13px;
      color: #f48771;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
  <div class="main">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="app-header">
        <img class="app-icon" src="/icon.png" alt="">
        <div class="app-name">MaestroDeck</div>
        <div class="app-version" id="app-version"></div>
      </div>

      <div class="section">
        <div class="section-label">Start</div>
        <ul class="action-list">
          <li>
            <button class="action-btn" onclick="openFolder()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M14.5 3H7.71l-.85-.85L6.51 2h-5l-.5.5v11l.5.5h13l.5-.5v-10L14.5 3zm-.51 8.49V13h-12V7h12v4.49zm0-5.49h-12V3h4.29l.86.85.35.15H14v2z"/>
              </svg>
              Open Folder
            </button>
          </li>
          <li>
            <button class="action-btn" onclick="newFolder()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M14.5 2H8.71l-.85-.85L7.51 1h-5l-.5.5v3h-1l-.5.5v9l.5.5h13l.5-.5v-10L14.5 2zm-6.51 9h-1V9.5l-.5-.5-.5.5V11h-1l-.5-.5.5-.5H6V8.5l.5-.5.5.5V10h1.5l.5.5-.5.5zm5.51 2h-12V7h12v6zm0-7h-12V3h4.29l.85.85.36.15H14v2z"/>
              </svg>
              New Folder
            </button>
          </li>
        </ul>
      </div>

      <div class="section">
        <div class="section-label">Recent</div>
        <ul class="recent-list" id="recent-list">
          <li class="status-msg">Loading...</li>
        </ul>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="panel-title">Changelog</div>
      <div id="changelog-container">
        <div class="status-msg">Loading release notes…</div>
      </div>
    </div>
  </div>

  <script>
    /* ── Markdown renderer (subset) ── */
    function md2html(text) {
      if (!text) return '';

      const fmt = s => s
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      const out = [];
      let inUl = false, inOl = false;

      const closeList = () => {
        if (inUl) { out.push('</ul>'); inUl = false; }
        if (inOl) { out.push('</ol>'); inOl = false; }
      };

      for (const raw of text.split('\n')) {
        if (/^###\s/.test(raw)) {
          closeList(); out.push(`<h3>${fmt(raw.slice(4))}</h3>`);
        } else if (/^##\s/.test(raw)) {
          closeList(); out.push(`<h2>${fmt(raw.slice(3))}</h2>`);
        } else if (/^#\s/.test(raw)) {
          closeList(); out.push(`<h1>${fmt(raw.slice(2))}</h1>`);
        } else if (/^[-*]\s/.test(raw)) {
          if (inOl) { out.push('</ol>'); inOl = false; }
          if (!inUl) { out.push('<ul>'); inUl = true; }
          out.push(`<li>${fmt(raw.slice(2))}</li>`);
        } else if (/^\d+\.\s/.test(raw)) {
          if (inUl) { out.push('</ul>'); inUl = false; }
          if (!inOl) { out.push('<ol>'); inOl = true; }
          out.push(`<li>${fmt(raw.replace(/^\d+\.\s+/, ''))}</li>`);
        } else {
          closeList();
          if (raw.trim()) out.push(`<p>${fmt(raw)}</p>`);
        }
      }
      closeList();
      return out.join('');
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    /* ── Folder icon SVG ── */
    const folderIcon = `<svg class="recent-folder-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M14.5 3H7.71l-.85-.85L6.51 2h-5l-.5.5v11l.5.5h13l.5-.5v-10L14.5 3zm-.51 8.49V13h-12V7h12v4.49zm0-5.49h-12V3h4.29l.86.85.35.15H14v2z"/>
    </svg>`;

    /* ── Recent workspaces ── */
    let _allWorkspaces = [];

    async function loadRecents() {
      try {
        const res = await fetch('/api/workspaces');
        _allWorkspaces = await res.json();
        renderRecents(_allWorkspaces, 5);
      } catch {
        document.getElementById('recent-list').innerHTML =
          '<li class="error-msg">Could not load recent workspaces.</li>';
      }
    }

    function renderRecents(workspaces, limit) {
      const list = document.getElementById('recent-list');
      if (!workspaces.length) {
        list.innerHTML = '<li class="no-recent">No recent workspaces.</li>';
        return;
      }

      const shown = workspaces.slice(0, limit);
      const hasMore = workspaces.length > limit;

      list.innerHTML = shown.map(w => `
        <li class="recent-item" data-path="${escHtml(w.path)}">
          ${folderIcon}
          <div class="recent-info">
            <div class="recent-name">${escHtml(w.name || w.path.split('/').pop())}</div>
            <div class="recent-path" title="${escHtml(w.path)}">${escHtml(w.path)}</div>
          </div>
        </li>`).join('')
        + (hasMore ? `<li><span class="more-link" id="more-recents-link">More… (${workspaces.length - limit} more)</span></li>` : '');

      list.querySelectorAll('.recent-item').forEach(item => {
        item.addEventListener('click', () => openWorkspace(item.dataset.path));
      });
      const moreLink = list.querySelector('#more-recents-link');
      if (moreLink) moreLink.addEventListener('click', showAllRecents);
    }

    function showAllRecents() {
      renderRecents(_allWorkspaces, _allWorkspaces.length);
    }

    /* ── Changelog ── */
    async function loadChangelog() {
      const container = document.getElementById('changelog-container');
      try {
        const res = await fetch('/api/releases');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const releases = await res.json();
        renderChangelog(releases.slice(0, 5));
      } catch (e) {
        container.innerHTML = `<div class="error-msg">Could not load release notes — ${escHtml(e.message)}</div>`;
      }
    }

    function renderChangelog(releases) {
      const container = document.getElementById('changelog-container');
      if (!releases.length) {
        container.innerHTML = '<div class="status-msg">No releases found.</div>';
        return;
      }

      container.innerHTML = releases.map((r, i) => {
        const bodyHtml = md2html(r.body || '');
        const isLong = (r.body || '').split('\n').length > 8 || (r.body || '').length > 450;
        const isLatest = i === 0;

        const nameSpan = r.name && r.name !== r.tag_name
          ? `<span class="release-name">${escHtml(r.name)}</span>` : '';
        const dateSpan = r.published_at
          ? `<span class="release-date">${formatDate(r.published_at)}</span>` : '';
        const badge = isLatest ? '<span class="release-badge">latest</span>' : '';

        const bodyClass = isLong ? 'release-body collapsed' : 'release-body';
        const seeMore = isLong
          ? `<button class="see-more-btn" onclick="toggleBody(${i}, this)">
               <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M7.976 10.072l4.357-4.357.62.618L8.284 11h-.618L3 6.333l.619-.618 4.357 4.357z"/></svg>
               See more
             </button>` : '';

        return `
          <div class="release">
            <div class="release-header">
              <span class="release-tag">${escHtml(r.tag_name)}</span>
              ${badge}${nameSpan}${dateSpan}
            </div>
            <div class="${bodyClass}" id="rb-${i}">${bodyHtml || '<p><em>No release notes.</em></p>'}</div>
            ${seeMore}
          </div>`;
      }).join('');
    }

    function toggleBody(i, btn) {
      const el = document.getElementById(`rb-${i}`);
      const collapsed = el.classList.toggle('collapsed');
      const arrow = btn.querySelector('svg');
      btn.lastChild.textContent = collapsed ? ' See more' : ' See less';
      arrow.style.transform = collapsed ? '' : 'rotate(180deg)';
    }

    /* ── Actions ── */
    async function openFolder() {
      try {
        const res = await fetch('/api/open-folder', { method: 'POST' });
        if (res.status === 204) return;
        const { path } = await res.json();
        if (path) window.electronAPI.openMain(path);
      } catch (e) { console.error('openFolder', e); }
    }

    async function newFolder() {
      try {
        const res = await fetch('/api/new-folder', { method: 'POST' });
        if (res.status === 204) return;
        const { path } = await res.json();
        if (path) window.electronAPI.openMain(path);
      } catch (e) { console.error('newFolder', e); }
    }

    async function openWorkspace(path) {
      await fetch('/api/workspaces/touch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path }),
      });
      window.electronAPI.openMain(path);
    }

    /* ── Init ── */
    fetch('/api/version').then(r => r.json()).then(({ version }) => {
      document.getElementById('app-version').textContent = version;
    }).catch(() => {});
    loadRecents();
    loadChangelog();
  </script>
</body>
</html>
