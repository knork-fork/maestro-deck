<link rel="stylesheet" href="/tiles/terminal/vendor/xterm.css">
<style>
  .terminal-wrap {
    width: 100%;
    height: 100%;
    background: #000;
    padding: 4px 6px;
    overflow: hidden;
    display: flex;
  }
  .terminal-wrap .xterm {
    flex: 1;
    width: 100%;
    height: 100%;
  }
  /* Hide xterm's viewport scrollbar — it renders a misleading thumb when
     the buffer isn't yet long enough to overflow. Scrolling still works via
     mouse wheel / Shift+PageUp/PageDown. */
  .terminal-wrap .xterm .xterm-viewport {
    scrollbar-width: none;
  }
  .terminal-wrap .xterm .xterm-viewport::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }
  .terminal-wrap .term-status {
    position: absolute;
    bottom: 6px;
    right: 10px;
    color: #d3d7cf;
    background: rgba(0,0,0,0.45);
    font: 11px/1.4 'Ubuntu Mono', monospace;
    padding: 2px 6px;
    border-radius: 3px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .terminal-wrap .term-status.visible { opacity: 1; }
</style>
<div class="terminal-wrap">
  <div class="xterm-host" style="flex:1;min-width:0;min-height:0;position:relative;">
    <div class="term-status"></div>
  </div>
</div>
