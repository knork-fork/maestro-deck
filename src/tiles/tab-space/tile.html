<style>
  .ts-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #1a1a1a;
  }

  .ts-tabbar {
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
    background: #111;
    border-bottom: 1px solid #2a2a2a;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    height: 28px;
    user-select: none;
  }
  .ts-tabbar::-webkit-scrollbar { display: none; }

  .ts-tab {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px 0 10px;
    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif;
    color: #888;
    cursor: pointer;
    border-right: 1px solid #1e1e1e;
    white-space: nowrap;
    flex-shrink: 0;
    background: none;
    border-top: none;
    border-left: none;
    border-bottom: 2px solid transparent;
    min-width: 60px;
    max-width: 160px;
  }
  .ts-tab:hover { color: #ccc; background: #181818; }
  .ts-tab.active { color: #fff; border-bottom-color: #4fc1ff; background: #1a1a1a; }

  .ts-tab-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    pointer-events: none;
  }

  .ts-tab-close {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    color: #555;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    line-height: 1;
  }
  .ts-tab-close:hover { color: #ccc; background: rgba(255,255,255,0.1); }

  .ts-add-btn {
    flex-shrink: 0;
    width: 28px;
    height: 100%;
    background: none;
    border: none;
    color: #555;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .ts-add-btn:hover { color: #ccc; background: rgba(255,255,255,0.05); }

  .ts-canvas-area {
    flex: 1 1 0;
    position: relative;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }

  .ts-canvas {
    position: absolute;
    inset: 0;
    display: flex;
    overflow: hidden;
    padding: 4px;
  }
  .ts-canvas.hidden { display: none; }

  /* Inner BSP classes — scoped to avoid conflict with outer framework */
  .ts-wrap .split { display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
  .ts-wrap .split[data-dir="h"] { flex-direction: row; }
  .ts-wrap .split[data-dir="v"] { flex-direction: column; }
  .ts-wrap .pane { display: flex; min-width: 0; min-height: 0; overflow: hidden; }

  .ts-wrap .splitter {
    flex: 0 0 7px;
    position: relative;
    background: transparent;
  }
  .ts-wrap .split[data-dir="h"] > .splitter { cursor: col-resize; }
  .ts-wrap .split[data-dir="v"] > .splitter { cursor: row-resize; }
  .ts-wrap .splitter::before {
    content: '';
    position: absolute;
    background: #1e1e1e;
    transition: background 0.12s;
  }
  .ts-wrap .split[data-dir="h"] > .splitter::before { top: 0; bottom: 0; left: 3px; width: 1px; }
  .ts-wrap .split[data-dir="v"] > .splitter::before { left: 0; right: 0; top: 3px; height: 1px; }
  .ts-wrap .splitter:hover::before,
  .ts-wrap .splitter.dragging::before { background: #4fc1ff; }

  .ts-wrap .tile {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
    overflow: hidden;
  }
  .ts-wrap .tile::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    pointer-events: none;
    z-index: 100;
  }
  .ts-wrap .tile.focused::after { border-color: rgba(255,255,255,0.6); }

  .ts-wrap .tile-titlebar {
    height: 16px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 2px;
    flex-shrink: 0;
    cursor: move;
    user-select: none;
  }
  .ts-wrap .tile-close {
    width: 16px;
    height: 14px;
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
  }
  .ts-wrap .tile-close:hover { color: #ccc; background: rgba(255,255,255,0.08); }

  .ts-wrap .tile-content {
    flex: 1 1 0;
    display: grid;
    grid-template: 1fr / 1fr;
    overflow: hidden;
    position: relative;
    min-height: 0;
    min-width: 0;
  }
  .ts-wrap .tile-content > * { min-width: 0; min-height: 0; width: 100%; height: 100%; }

  .ts-drop-preview {
    position: absolute;
    pointer-events: none;
    border: 2px dashed #4fc1ff;
    background: rgba(79,193,255,0.08);
    border-radius: 3px;
    z-index: 1000;
    box-sizing: border-box;
  }
  .ts-drop-preview.swap {
    border-style: solid;
    background: rgba(79,193,255,0.14);
  }
</style>
<div class="ts-wrap">
  <div class="ts-tabbar"></div>
  <div class="ts-canvas-area"></div>
</div>
