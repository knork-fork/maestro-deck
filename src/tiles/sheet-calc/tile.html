<style>
  .sc-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #1a1a1a;
    color: #ddd;
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 12px;
    user-select: none;
  }
  .sc-formula-bar {
    flex: 0 0 26px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid #2a2a2a;
    padding: 0 8px;
    background: #111;
    flex-shrink: 0;
  }
  .sc-cell-label {
    width: 42px;
    min-width: 42px;
    color: #4fc1ff;
    font-weight: 600;
    font-size: 11px;
    text-align: center;
  }
  .sc-formula-sep {
    width: 1px;
    height: 14px;
    background: #333;
    flex-shrink: 0;
  }
  .sc-formula-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #eee;
    outline: none;
    font-family: inherit;
    font-size: 12px;
    padding: 0;
  }
  .sc-grid-container {
    flex: 1;
    overflow: auto;
    position: relative;
  }
  .sc-grid-container::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .sc-grid-container::-webkit-scrollbar-track {
    background: transparent;
  }
  .sc-grid-container::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 3px;
  }
  .sc-overlay-anchor {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    overflow: visible;
    pointer-events: none;
  }
  .sc-edit-input {
    position: absolute;
    border: 2px solid #4fc1ff;
    background: #1e2a35;
    color: #eee;
    padding: 0 3px;
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 12px;
    z-index: 10;
    box-sizing: border-box;
    outline: none;
    pointer-events: auto;
  }
  table.sc-grid {
    border-collapse: collapse;
    table-layout: fixed;
    outline: none;
  }
  table.sc-grid th {
    background: #1f1f1f;
    color: #666;
    font-weight: 500;
    text-align: center;
    font-size: 11px;
    border: 1px solid #2a2a2a;
    padding: 0 4px;
    height: 22px;
    white-space: nowrap;
    overflow: hidden;
  }
  table.sc-grid thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #1f1f1f;
  }
  table.sc-grid tbody th {
    position: sticky;
    left: 0;
    z-index: 1;
    background: #1f1f1f;
    min-width: 40px;
    width: 40px;
  }
  table.sc-grid thead th:first-child {
    position: sticky;
    top: 0;
    left: 0;
    z-index: 3;
    background: #1a1a1a;
  }
  table.sc-grid td {
    border: 1px solid #252525;
    padding: 1px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    height: 22px;
    min-width: 80px;
    width: 80px;
    cursor: default;
    color: #ccc;
  }
  table.sc-grid td.sc-selected {
    outline: 2px solid #4fc1ff;
    outline-offset: -1px;
    background: rgba(79, 193, 255, 0.06);
  }
  table.sc-grid td.sc-formula {
    color: #7ec8a0;
  }
  table.sc-grid td.sc-error {
    color: #e06c75;
    font-style: italic;
  }
  table.sc-grid tbody tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }
  table.sc-grid tbody tr:hover td.sc-selected {
    background: rgba(79, 193, 255, 0.06);
  }
  table.sc-grid td.sc-point {
    background: rgba(130, 210, 130, 0.12);
    outline: 1px solid #7ec8a0;
    outline-offset: -1px;
  }
</style>
<div class="sc-wrap">
  <div class="sc-formula-bar">
    <span class="sc-cell-label"></span>
    <div class="sc-formula-sep"></div>
    <input class="sc-formula-input" type="text" spellcheck="false" autocomplete="off" />
  </div>
  <div class="sc-grid-container">
    <div class="sc-overlay-anchor"></div>
    <table class="sc-grid"></table>
  </div>
</div>
