<style>
  .pom-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #2c2c2c;
    color: #eeeeec;
    gap: 16px;
    user-select: none;
  }
  .pom-display {
    font-family: 'Cascadia Code', 'Fira Code', 'Ubuntu Mono', 'DejaVu Sans Mono', monospace;
    font-size: clamp(28px, 8vw, 64px);
    font-weight: 300;
    letter-spacing: 0.05em;
    color: #eeeeec;
    transition: color 0.2s;
  }
  @keyframes pom-flash {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
  .pom-display.done {
    animation: pom-flash 1s step-start infinite;
    color: #f0c040;
  }
  .pom-controls {
    display: flex;
    gap: 8px;
  }
  .pom-btn {
    background: #3a3a3a;
    color: #ccc;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 5px 16px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .pom-btn:hover {
    background: #484848;
    color: #eee;
  }
  .pom-btn.pom-start.running {
    border-color: #e05050;
    color: #e07070;
  }
  .pom-btn.pom-start.running:hover {
    background: #4a2a2a;
  }
  .pom-duration-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #666;
  }
  .pom-duration {
    background: #222;
    color: #999;
    border: 1px solid #444;
    border-radius: 3px;
    width: 40px;
    padding: 2px 4px;
    font-size: 11px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .pom-duration::-webkit-outer-spin-button,
  .pom-duration::-webkit-inner-spin-button {
    -webkit-appearance: none;
  }
  .pom-duration:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
<div class="pom-wrap">
  <div class="pom-display">25:00</div>
  <div class="pom-controls">
    <button class="pom-btn pom-start">Start</button>
    <button class="pom-btn pom-reset">Reset</button>
  </div>
  <div class="pom-duration-row">
    <input class="pom-duration" type="number" min="1" max="99" value="25">
    <span>min</span>
  </div>
</div>
