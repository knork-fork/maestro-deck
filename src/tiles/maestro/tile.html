<style>
  .maestro-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
    color: #d0cfcc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Ubuntu, sans-serif;
    box-sizing: border-box;
  }

  /* ── View base ── */
  .maestro-view {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  /* ── Init view ── */
  .maestro-init {
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .maestro-init-title {
    font-size: 13px;
    color: #666;
    margin-bottom: 4px;
    letter-spacing: 0.03em;
  }
  .maestro-init-btns {
    display: flex;
    gap: 10px;
  }
  .maestro-btn {
    padding: 7px 20px;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    color: #d0cfcc;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .maestro-btn:hover { background: #2a2a2a; border-color: #666; }
  .maestro-btn-primary {
    background: #1e3a5f;
    border-color: #2d5a8e;
    color: #fff;
  }
  .maestro-btn-primary:hover { background: #2d5a8e; border-color: #4a7ab5; }

  /* ── Resume list view ── */
  .maestro-resume {
    overflow: hidden;
  }
  .maestro-resume-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px 6px;
    flex-shrink: 0;
  }
  .maestro-resume-back {
    background: none;
    border: none;
    color: #666;
    cursor: pointer;
    padding: 2px 4px;
    font-size: 16px;
    line-height: 1;
    border-radius: 3px;
    display: flex;
    align-items: center;
  }
  .maestro-resume-back:hover { color: #aaa; background: rgba(255,255,255,0.06); }
  .maestro-search-input {
    flex: 1;
    background: #252525;
    border: 1px solid #3a3a3a;
    border-radius: 3px;
    padding: 5px 9px;
    color: #d0cfcc;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .maestro-search-input:focus { border-color: #4fc1ff; }
  .maestro-search-input::placeholder { color: #555; }
  .maestro-resume-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding: 2px 0;
  }
  .maestro-resume-item {
    padding: 8px 14px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    transition: background 0.1s;
  }
  .maestro-resume-item:hover { background: #242424; }
  .maestro-resume-item-summary {
    font-size: 13px;
    color: #d0cfcc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .maestro-resume-item-id {
    font-size: 11px;
    color: #555;
    margin-top: 2px;
    font-family: 'Ubuntu Mono', 'Cascadia Mono', monospace;
  }
  .maestro-resume-empty {
    padding: 20px 14px;
    color: #555;
    font-size: 12px;
    text-align: center;
  }

  /* ── Continue view ── */
  .maestro-continue {
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
  }
  .maestro-continue-label {
    font-size: 12px;
    color: #666;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .maestro-continue-ticket {
    font-size: 14px;
    color: #c0c0c0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .maestro-continue-btns {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  /* ── Active view ── */
  .maestro-active {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  /* Ensure terminal tile fills the active view completely */
  .maestro-active .terminal-wrap {
    height: 100%;
  }

  /* ── Titlebar extra elements ── */
  .maestro-title-label {
    font-size: 11px;
    color: #777;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .maestro-renew-btn {
    pointer-events: auto;
    background: none;
    border: 1px solid #3a3a3a;
    border-radius: 3px;
    color: #888;
    cursor: pointer;
    padding: 1px 5px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-family: inherit;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .maestro-renew-btn:hover { color: #ccc; border-color: #666; background: rgba(255,255,255,0.06); }
  .maestro-renew-btn svg { flex-shrink: 0; }
</style>

<div class="maestro-wrap">

  <!-- View: init — New + Resume buttons -->
  <div class="maestro-view maestro-init" data-view="init">
    <div class="maestro-init-title">maestro</div>
    <div class="maestro-init-btns">
      <button class="maestro-btn maestro-btn-primary maestro-btn-new">New</button>
      <button class="maestro-btn maestro-btn-resume-list">Resume</button>
    </div>
  </div>

  <!-- View: resume-list — scrollable ticket list with search -->
  <div class="maestro-view maestro-resume" data-view="resume-list" style="display:none">
    <div class="maestro-resume-header">
      <button class="maestro-resume-back" title="Back">&#8592;</button>
      <input class="maestro-search-input" type="search" placeholder="Search tickets…" autocomplete="off" spellcheck="false">
    </div>
    <div class="maestro-resume-list"></div>
  </div>

  <!-- View: continue — "Continue with ticket X?" prompt -->
  <div class="maestro-view maestro-continue" data-view="continue" style="display:none">
    <div class="maestro-continue-label">Continue with ticket</div>
    <div class="maestro-continue-ticket maestro-continue-id"></div>
    <div class="maestro-continue-btns">
      <button class="maestro-btn maestro-btn-primary maestro-btn-yes">Yes</button>
      <button class="maestro-btn maestro-btn-no">No</button>
    </div>
  </div>

  <!-- View: active — terminal HTML injected here at runtime -->
  <div class="maestro-view maestro-active" data-view="active" style="display:none"></div>

</div>
